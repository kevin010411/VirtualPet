; Profile Resolver schema version: 1
[platformio]
default_envs = project_36

[env]
platform = ststm32
board = genericSTM32F103CB
framework = arduino
upload_protocol = stlink
board_build.f_cpu = 108000000L
build_flags =
	-Os
	-flto
	-ffunction-sections
	-fdata-sections
	-fno-exceptions
build_unflags =
	-Og
	-O0
	-O1
	-O2
	-O3
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.5
	adafruit/Adafruit ST7735 and ST7789 Library
	adafruit/SdFat - Adafruit Fork@^2.2.54

[env:profile_base]
build_flags =
	${env.build_flags}
	-DENABLE_DEBUG=0

[env:project_36]
extends = env:profile_base
build_flags =
	${env:profile_base.build_flags}
	-DPLATFORM_MCU_GD32F103CBT6=1
	-DPLATFORM_GD32_CLOCK_108MHZ=1
	-DPREFETCH_ENABLE=0
	-DENABLE_SEQUENCE_AUDIO=0
	-DENABLE_GUESS_GAME=0
	-DENABLE_STARTUP_ANIMATION=1
	-DENABLE_COMMAND_OUTFIT=0
	-DENABLE_APPEARANCE_SELECTION=0
	-DENABLE_COLLECTION_CATALOG=0
	-DENABLE_INSTRUCTION_RESPONSE=0
	-DENABLE_COMMAND_PREDICT=0
	-DENABLE_DEATH=1
	-DENABLE_FIRST_START_ANIMATION=1
	-DENABLE_GUESS_GAME_SINGLE_ROUND=1
	-DENABLE_GUESS_GAME_PLAYER_CHOICE_RESULT=1
	-DENABLE_SEQUENTIAL_STATUS_SET_SELECTION=0
	-DAPP_MAX_PET_STATS=12
	-DAPP_MAX_SCREEN_RULES=1
	-DAPP_MAX_ACTIONS=5
	-DAPP_MAX_ACTION_OUTCOMES=5
	-DAPP_MAX_ACTION_EFFECTS=10

