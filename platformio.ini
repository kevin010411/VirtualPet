[platformio]
default_envs = new_taipei_childrens_day

[env]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink
upload_port = COM3
build_flags =
	-Os
	-flto
	-ffunction-sections
	-fdata-sections
	-fno-exceptions
	-DENABLE_GUESS_GAME_SINGLE_ROUND=1
	-DENABLE_GUESS_GAME_PLAYER_CHOICE_RESULT=1
build_unflags =
	-Og
	-O0
	-O1
	-O2
	-O3
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.5
	adafruit/Adafruit ST7735 and ST7789 Library
	adafruit/SdFat - Adafruit Fork@^2.2.54

[env:profile_base]
build_flags =
	${env.build_flags}
	-DENABLE_DEBUG=0

[env:standard_command_base]
extends = env:profile_base
build_flags =
	${env:profile_base.build_flags}
	-DENABLE_COMMAND_GIFT=1
	-DENABLE_COMMAND_OUTFIT=0
	-DENABLE_COMMAND_SPECIES=0
	-DENABLE_CUSTOM_RULES=0
	-DAPP_MAX_ANIMATION_VARIANTS=2

[env:small]
extends = env:profile_base
build_flags =
	${env:profile_base.build_flags}
	-DAPP_PROFILE=APP_PROFILE_DEFAULT_SMALL
	-DENABLE_GUESS_ITEM_GAME=1
	-DENABLE_APPEARANCE_SELECTION=1
	-DENABLE_COMMAND_PREDICT=0
	-DENABLE_COMMAND_GIFT=0
	-DENABLE_COMMAND_OUTFIT=0
	-DENABLE_COMMAND_SPECIES=1
	-DENABLE_CUSTOM_RULES=0
	-DAPP_MAX_LOADED_ANIMATIONS=44
	-DAPP_MAX_ANIMATION_VARIANTS=2

[env:macaron]
extends = env:standard_command_base
build_flags =
	${env:standard_command_base.build_flags}
	-DAPP_PROFILE=APP_PROFILE_DEFAULT
	-DENABLE_GUESS_ITEM_GAME=1
	-DENABLE_APPEARANCE_SELECTION=0
	-DENABLE_COMMAND_PREDICT=1
	-DAPP_MAX_LOADED_ANIMATIONS=48

; 新北兒童節
[env:new_taipei_childrens_day]
extends = env:standard_command_base
build_flags =
	${env:standard_command_base.build_flags}
	-DAPP_PROFILE=APP_PROFILE_NEW_TAIPEI_CHILDRENS_DAY
	-DENABLE_GUESS_ITEM_GAME=0
	-DENABLE_STARTUP_ANIMATION=1
	-DENABLE_FIRST_LAUNCH_SELECTION=1
	-DENABLE_OUTFIT_CHOOSE_ANIMATION=1
	-DENABLE_APPEARANCE_SELECTION=1
	-DENABLE_COMMAND_PREDICT=0
	-DAPP_MAX_LOADED_ANIMATIONS=24

[env:dipsyho]
extends = env:standard_command_base
build_flags =
	${env:standard_command_base.build_flags}
	-DAPP_PROFILE=APP_PROFILE_DIPSYHO
	-DENABLE_GUESS_ITEM_GAME=1
	-DENABLE_GUESS_GAME_PLAYER_CHOICE_RESULT=1
	-DENABLE_APPEARANCE_SELECTION=0
	-DENABLE_STARTUP_ANIMATION=1
	-DENABLE_COMMAND_PREDICT=0
	-DAPP_MAX_LOADED_ANIMATIONS=28

[env:small_multi_status]
extends = env:small

[env:small_status_anime]
extends = env:small

[env:small_start]
extends = env:small
build_flags =
	${env:small.build_flags}
	-DENABLE_STARTUP_ANIMATION=1

[env:kuromu]
extends = env:profile_base
build_flags =
	${env:profile_base.build_flags}
	-DAPP_PROFILE=APP_PROFILE_KUROMU
	-DENABLE_GUESS_ITEM_GAME=0
	-DENABLE_OUTFIT_CHOOSE_ANIMATION=1
	-DENABLE_DYNAMIC_ACTION_LAYOUT=1
	-DENABLE_APPEARANCE_SELECTION=1
	-DENABLE_COMMAND_PREDICT=0
	-DENABLE_COMMAND_GIFT=1
	-DENABLE_COMMAND_OUTFIT=1
	-DENABLE_COMMAND_SPECIES=0
	-DENABLE_CUSTOM_RULES=1
	-DAPP_MAX_LOADED_ANIMATIONS=32
	-DAPP_MAX_NAMED_ANIMATIONS=4
	-DAPP_MAX_ANIMATION_VARIANTS=8
